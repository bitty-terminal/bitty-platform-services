name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - name: Resolve Rust channel (rust-toolchain.toml)
        id: rust-channel
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: rustfmt, clippy
      - name: Cache Rust compilation artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-${{ runner.os }}-${{ steps.rust-channel.outputs.channel }}
      - run: just check

  msrv:
    name: MSRV 1.85 check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install MSRV toolchain 1.85
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.85
          components: clippy
      - name: Cache Rust compilation artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-${{ runner.os }}-1.85
      - name: Check MSRV compilation
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo +1.85 check --workspace --all-targets --locked

  linux:
    name: Linux check and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve Rust channel (rust-toolchain.toml)
        id: rust-channel
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: clippy
      - name: Cache Rust compilation artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-${{ runner.os }}-${{ steps.rust-channel.outputs.channel }}
      - name: Check workspace compilation (Linux)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --workspace --all-targets --locked
      - name: Run tests (Linux)
        run: cargo test --workspace --all-targets --locked

  windows:
    name: Windows check and test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve Rust channel (rust-toolchain.toml)
        id: rust-channel
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: clippy
      - name: Cache Rust compilation artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-${{ runner.os }}-${{ steps.rust-channel.outputs.channel }}
      - name: Check workspace compilation (Windows)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --workspace --all-targets --locked
      - name: Run tests (Windows)
        run: cargo test --workspace --locked

  macos:
    name: macOS check and test
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve Rust channel (rust-toolchain.toml)
        id: rust-channel
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: clippy
      - name: Cache Rust compilation artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust-${{ runner.os }}-${{ steps.rust-channel.outputs.channel }}
      - name: Check workspace compilation (macOS)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --workspace --all-targets --locked
      - name: Run tests (macOS)
        run: cargo test --workspace --locked

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve Rust channel (rust-toolchain.toml)
        id: rust-channel
        run: |
          channel="$(scripts/rust-channel.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        # NOTE: do NOT pass `arguments: check` — the action's `command`
        # input already defaults to `check`, and passing both yields
        # `check check` (invalid value for [WHICH], red supply-chain gate).
        # `cargo deny` auto-discovers `deny.toml` at the repo root.

  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
